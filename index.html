<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> Studio </title>
<style>
  * { box-sizing: border-box; font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; }
  body {
    background: #0a0a0c;
    min-height: 100vh;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    color: #e8e6e3;
  }
  .app {
    background: #131316;
    border-radius: 24px;
    padding: 32px;
    max-width: 1500px;
    width: 100%;
    box-shadow: 0 40px 80px -20px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.04);
    display: grid;
    grid-template-columns: 380px 1fr;
    gap: 32px;
  }
  @media (max-width: 1100px) { .app { grid-template-columns: 1fr; } }

  .sidebar h1 {
    font-weight: 300;
    font-size: 1.5rem;
    letter-spacing: -0.02em;
    margin: 0 0 6px 0;
    color: #fff;
  }
  .sidebar h1 span {
    background: linear-gradient(135deg, #ffb347, #ff7e5f);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: 700;
  }
  .sidebar .desc {
    color: #6b6b72;
    font-size: 0.85rem;
    line-height: 1.6;
    margin: 0 0 24px 0;
  }

  .upload-box {
    background: #1a1a1f;
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 14px;
    transition: border-color 0.2s;
  }
  .upload-box:hover { border-color: rgba(255,179,71,0.4); }
  .upload-box.done { border-color: #2ecc71; }
  .upload-box .label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.8rem;
    font-weight: 500;
    color: #9a9aa0;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 10px;
  }
  .upload-box .label .badge {
    background: #2a2a30;
    color: #6b6b72;
    font-size: 0.65rem;
    padding: 3px 8px;
    border-radius: 20px;
  }
  .upload-box.done .label .badge { background: rgba(46,204,113,0.15); color: #2ecc71; }
  .upload-box input[type="file"] {
    width: 100%;
    font-size: 0.8rem;
    color: #6b6b72;
  }
  .upload-box input[type="file"]::file-selector-button {
    background: #2a2a30;
    color: #e8e6e3;
    border: none;
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 0.8rem;
    font-weight: 500;
    margin-right: 12px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .upload-box input[type="file"]::file-selector-button:hover { background: #3a3a42; }

  .section-title {
    font-size: 0.7rem;
    font-weight: 600;
    color: #6b6b72;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin: 22px 0 12px 0;
  }

  .presets {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .preset {
    background: #1a1a1f;
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 0.8rem;
    color: #9a9aa0;
    cursor: pointer;
    transition: all 0.15s;
    text-align: center;
  }
  .preset:hover { border-color: rgba(255,179,71,0.3); color: #e8e6e3; }
  .preset.active {
    background: linear-gradient(135deg, rgba(255,179,71,0.15), rgba(255,126,95,0.1));
    border-color: #ffb347;
    color: #ffb347;
    font-weight: 600;
  }

  .sliders { margin-top: 18px; }
  .slider-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
  }
  .slider-row label {
    font-size: 0.75rem;
    color: #9a9aa0;
    width: 100px;
    flex-shrink: 0;
  }
  .slider-row input[type="range"] {
    flex: 1;
    -webkit-appearance: none;
    height: 3px;
    background: #2a2a30;
    border-radius: 3px;
    outline: none;
  }
  .slider-row input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    background: #ffb347;
    border-radius: 50%;
    cursor: pointer;
    box-shadow: 0 0 0 4px rgba(255,179,71,0.15);
  }
  .slider-row .val {
    font-size: 0.7rem;
    color: #6b6b72;
    width: 40px;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  .btn {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: none;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    margin-top: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .btn-primary {
    background: linear-gradient(135deg, #ffb347, #ff7e5f);
    color: #1a1a1f;
    box-shadow: 0 8px 24px -6px rgba(255,126,95,0.5);
  }
  .btn-primary:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 12px 32px -6px rgba(255,126,95,0.6); }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  .btn-ghost {
    background: #1a1a1f;
    color: #9a9aa0;
    border: 1px solid rgba(255,255,255,0.06);
  }
  .btn-ghost:hover { background: #222228; color: #e8e6e3; }

  .preview-wrap {
    background: #0a0a0c;
    border-radius: 16px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    border: 1px solid rgba(255,255,255,0.04);
  }
  .canvas-holder {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    border-radius: 12px;
    overflow: hidden;
    min-height: 500px;
    position: relative;
  }
  canvas {
    max-width: 100%;
    max-height: 70vh;
    display: block;
    border-radius: 12px;
  }
  .status {
    font-size: 0.8rem;
    color: #6b6b72;
    text-align: center;
    min-height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .status .dot {
    width: 6px; height: 6px; border-radius: 50%; background: #6b6b72;
  }
  .status.working .dot { background: #ffb347; animation: pulse 1.2s infinite; }
  .status.done .dot { background: #2ecc71; }
  .status.error .dot { background: #e74c3c; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

  .progress {
    height: 2px;
    background: #1a1a1f;
    border-radius: 2px;
    overflow: hidden;
    display: none;
  }
  .progress.active { display: block; }
  .progress-inner {
    height: 100%;
    background: linear-gradient(90deg, #ffb347, #ff7e5f);
    width: 0%;
    transition: width 0.3s;
  }
</style>
</head>
<body>
<div class="app">
  <!-- SIDEBAR -->
  <div class="sidebar">
    <h1>Mulanga`s <span>Studio</span></h1>
    <p class="desc">Photorealistic composite engine..</p>

    <div class="upload-box" id="bgBox">
      <div class="label"><span>Background</span><span class="badge" id="bgBadge">empty</span></div>
      <input type="file" id="bgInput" accept="image/*">
    </div>

    <div class="upload-box" id="fgBox">
      <div class="label"><span>Subject (car)</span><span class="badge" id="fgBadge">empty</span></div>
      <input type="file" id="fgInput" accept="image/*">
    </div>

    <div class="section-title">Scene Lighting</div>
    <div class="presets" id="lightPresets">
      <div class="preset active" data-preset="auto">Auto Match</div>
      <div class="preset" data-preset="golden">Golden Hour</div>
      <div class="preset" data-preset="overcast">Overcast</div>
      <div class="preset" data-preset="night">Night</div>
      <div class="preset" data-preset="studio">Studio</div>
      <div class="preset" data-preset="dramatic">Dramatic</div>
    </div>

    <div class="sliders">
      <div class="slider-row">
        <label>Subject size</label>
        <input type="range" id="sizeSlider" min="30" max="95" value="62">
        <span class="val" id="sizeVal">62%</span>
      </div>
      <div class="slider-row">
        <label>Position Y</label>
        <input type="range" id="posYSlider" min="0" max="100" value="70">
        <span class="val" id="posYVal">70%</span>
      </div>
      <div class="slider-row">
        <label>Shadow</label>
        <input type="range" id="shadowSlider" min="0" max="100" value="55">
        <span class="val" id="shadowVal">55%</span>
      </div>
      <div class="slider-row">
        <label>Blend</label>
        <input type="range" id="blendSlider" min="0" max="100" value="40">
        <span class="val" id="blendVal">40%</span>
      </div>
      <div class="slider-row">
        <label>Warmth</label>
        <input type="range" id="warmSlider" min="-50" max="50" value="0">
        <span class="val" id="warmVal">0</span>
      </div>
    </div>

    <button class="btn btn-primary" id="renderBtn" disabled>Render Composite</button>
    <button class="btn btn-ghost" id="downloadBtn" disabled>Download PNG</button>
    <button class="btn btn-ghost" id="resetBtn">Reset</button>
  </div>

  <!-- PREVIEW -->
  <div class="preview-wrap">
    <div class="canvas-holder">
      <canvas id="canvas" width="1400" height="900"></canvas>
    </div>
    <div class="progress" id="progress"><div class="progress-inner" id="progressInner"></div></div>
    <div class="status" id="status"><span class="dot"></span><span id="statusText">Upload both images to begin.</span></div>
  </div>
</div>

<script type="module">
import { removeBackground } from 'https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.4.5/dist/index.mjs';

/* ============================================================
   STATE
   ============================================================ */
const S = {
  bg: null,          // background Image
  fg: null,          // original subject Image
  cutout: null,      // AI cutout Image (transparent PNG)
  bgReady: false,
  fgReady: false,
  cutoutReady: false,
  preset: 'auto',
  sizePct: 62,
  posYPct: 70,
  shadowAmt: 55,
  blendAmt: 40,
  warmth: 0,
  processing: false,
  lastPNG: null,
  sceneLight: { r: 255, g: 255, b: 255, brightness: 0.5, warmth: 0, keyAngle: -45 }
};

/* ============================================================
   DOM
   ============================================================ */
const $ = id => document.getElementById(id);
const bgInput = $('bgInput'), fgInput = $('fgInput');
const bgBox = $('bgBox'), fgBox = $('fgBox');
const bgBadge = $('bgBadge'), fgBadge = $('fgBadge');
const renderBtn = $('renderBtn'), downloadBtn = $('downloadBtn'), resetBtn = $('resetBtn');
const canvas = $('canvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });
const statusEl = $('status'), statusText = $('statusText');
const progressEl = $('progress'), progressInner = $('progressInner');

/* ============================================================
   STATUS
   ============================================================ */
function setStatus(text, kind = '') {
  statusText.textContent = text;
  statusEl.className = 'status' + (kind ? ' ' + kind : '');
}
function setProgress(pct) {
  if (pct > 0 && pct < 100) {
    progressEl.classList.add('active');
    progressInner.style.width = pct + '%';
  } else {
    progressEl.classList.remove('active');
    progressInner.style.width = '0%';
  }
}
function updateButtons() {
  renderBtn.disabled = !(S.bgReady && S.cutoutReady) || S.processing;
}

/* ============================================================
   FILE LOADING
   ============================================================ */
function loadImg(file) {
  return new Promise((res, rej) => {
    if (!file || !file.type.startsWith('image/')) return rej(new Error('Not an image'));
    const r = new FileReader();
    r.onload = e => {
      const i = new Image();
      i.onload = () => res(i);
      i.onerror = () => rej(new Error('Load failed'));
      i.src = e.target.result;
    };
    r.onerror = () => rej(new Error('Read failed'));
    r.readAsDataURL(file);
  });
}

/* ============================================================
   SCENE LIGHT ANALYSIS
   Reads the background image and determines dominant color,
   brightness, and estimated key-light direction.
   ============================================================ */
function analyzeScene(img) {
  // Downsample to a small canvas for fast analysis
  const w = 64, h = 64;
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const cx = c.getContext('2d');
  cx.drawImage(img, 0, 0, w, h);
  const d = cx.getImageData(0, 0, w, h).data;

  let rSum = 0, gSum = 0, bSum = 0, lumSum = 0;
  let topLum = 0, topN = 0, botLum = 0, botN = 0;
  let leftLum = 0, leftN = 0, rightLum = 0, rightN = 0;
  const n = w * h;

  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const i = (y * w + x) * 4;
      const r = d[i], g = d[i+1], b = d[i+2];
      const lum = 0.299 * r + 0.587 * g + 0.114 * b;
      rSum += r; gSum += g; bSum += b; lumSum += lum;

      if (y < h / 3) { topLum += lum; topN++; }
      if (y > h * 2/3) { botLum += lum; botN++; }
      if (x < w / 3) { leftLum += lum; leftN++; }
      if (x > w * 2/3) { rightLum += lum; rightN++; }
    }
  }

  const avgR = rSum / n, avgG = gSum / n, avgB = bSum / n;
  const avgLum = lumSum / n;
  const top = topLum / topN, bot = botLum / botN;
  const left = leftLum / leftN, right = rightLum / rightN;

  // Estimate key light: brightest quadrant
  const quads = [
    { name: 'tl', v: (top + left) / 2, angle: -135 },
    { name: 'tr', v: (top + right) / 2, angle: -45 },
    { name: 'bl', v: (bot + left) / 2, angle: 135 },
    { name: 'br', v: (bot + right) / 2, angle: 45 }
  ];
  quads.sort((a, b) => b.v - a.v);
  const keyAngle = quads[0].angle;

  // Warmth: positive = warm (more R), negative = cool (more B)
  const warmth = (avgR - avgB) / 255;

  return {
    r: avgR, g: avgG, b: avgB,
    brightness: avgLum / 255,
    warmth,
    keyAngle,
    top, bot, left, right
  };
}

/* ============================================================
   AI CUTOUT
   ============================================================ */
async function runCutout(file) {
  setStatus('AI is isolating the subject…', 'working');
  setProgress(5);
  try {
    const blob = await removeBackground(file, {
      progress: (k, cur, tot) => setProgress(Math.round((cur / tot) * 95))
    });
    const url = URL.createObjectURL(blob);
    const img = await new Promise((res, rej) => {
      const i = new Image();
      i.onload = () => res(i);
      i.onerror = () => rej(new Error('Cutout load failed'));
      i.src = url;
    });
    setProgress(100);
    setTimeout(() => setProgress(0), 400);
    return img;
  } catch (e) {
    console.warn('AI cutout failed, using original with soft mask fallback:', e);
    // Fallback: use original image (transparent PNG or manual mask via simple threshold)
    const img = await loadImg(file);
    // Apply simple corner-based mask
    return makeFallbackCutout(img);
  }
}

function makeFallbackCutout(img) {
  const c = document.createElement('canvas');
  c.width = img.width; c.height = img.height;
  const cx = c.getContext('2d');
  cx.drawImage(img, 0, 0);
  const d = cx.getImageData(0, 0, c.width, c.height);
  const px = d.data;

  // Sample corners
  const corners = [[0,0],[c.width-1,0],[0,c.height-1],[c.width-1,c.height-1]];
  let r0=0,g0=0,b0=0;
  corners.forEach(([x,y]) => {
    const i = (y*c.width + x) * 4;
    r0 += px[i]; g0 += px[i+1]; b0 += px[i+2];
  });
  r0/=4; g0/=4; b0/=4;

  const thr = 60;
  for (let i = 0; i < px.length; i += 4) {
    const dr = px[i]-r0, dg = px[i+1]-g0, db = px[i+2]-b0;
    const dist = Math.sqrt(dr*dr + dg*dg + db*db);
    if (dist < thr) px[i+3] = 0;
    else if (dist < thr + 25) px[i+3] = Math.round(px[i+3] * (dist - thr) / 25);
  }
  cx.putImageData(d, 0, 0);
  const out = new Image();
  return new Promise(res => {
    out.onload = () => res(out);
    out.src = c.toDataURL();
  });
}

/* ============================================================
   RELIGHTING — apply scene color cast to the cutout
   ============================================================ */
function relightCutout(cutout, scene) {
  const c = document.createElement('canvas');
  c.width = cutout.width;
  c.height = cutout.height;
  const cx = c.getContext('2d');
  cx.drawImage(cutout, 0, 0);
  const d = cx.getImageData(0, 0, c.width, c.height);
  const px = d.data;

  // Preset overrides
  let targetR = scene.r, targetG = scene.g, targetB = scene.b;
  let brightnessScale = 1.0;
  let keyAngle = scene.keyAngle;

  switch (S.preset) {
    case 'golden':
      targetR = 255; targetG = 200; targetB = 140;
      brightnessScale = 1.05;
      keyAngle = -60;
      break;
    case 'overcast':
      targetR = 210; targetG = 215; targetB = 225;
      brightnessScale = 0.95;
      keyAngle = -90;
      break;
    case 'night':
      targetR = 60; targetG = 80; targetB = 140;
      brightnessScale = 0.55;
      keyAngle = -30;
      break;
    case 'studio':
      targetR = 240; targetG = 240; targetB = 240;
      brightnessScale = 1.0;
      keyAngle = -45;
      break;
    case 'dramatic':
      targetR = 200; targetG = 140; targetB = 90;
      brightnessScale = 0.85;
      keyAngle = -120;
      break;
    case 'auto':
    default:
      // use scene values
      break;
  }

  // Normalize: how much do we tint? Use blendAmt to control strength
  const tintStrength = (S.preset === 'auto' ? 0.35 : 0.55) * (S.blendAmt / 100 + 0.3);

  // Compute light direction vector for shading
  const rad = (keyAngle * Math.PI) / 180;
  const lx = Math.cos(rad);
  const ly = Math.sin(rad);

  for (let y = 0; y < c.height; y++) {
    for (let x = 0; x < c.width; x++) {
      const i = (y * c.width + x) * 4;
      if (px[i+3] === 0) continue;

      // --- Lighting directional shading: pixels facing the key light get brighter ---
      const nx = (x / c.width) - 0.5;
      const ny = (y / c.height) - 0.5;
      const facing = (nx * lx + ny * ly) + 0.5; // 0..1
      const shade = 0.65 + facing * 0.55;       // 0.65..1.2

      let r = px[i] * shade;
      let g = px[i+1] * shade;
      let b = px[i+2] * shade;

      // --- Tint toward scene color (like ambient bounce light) ---
      r = r * (1 - tintStrength) + targetR * tintStrength * (r / 255);
      g = g * (1 - tintStrength) + targetG * tintStrength * (g / 255);
      b = b * (1 - tintStrength) + targetB * tintStrength * (b / 255);

      // --- Brightness scale ---
      r *= brightnessScale;
      g *= brightnessScale;
      b *= brightnessScale;

      // --- Manual warmth slider ---
      const w = S.warmth / 100;
      r = r * (1 + w * 0.4);
      g = g * (1 + w * 0.1);
      b = b * (1 - w * 0.4);

      // --- Slight contrast S-curve for realism ---
      const contrast = 1.08;
      r = ((r / 255 - 0.5) * contrast + 0.5) * 255;
      g = ((g / 255 - 0.5) * contrast + 0.5) * 255;
      b = ((b / 255 - 0.5) * contrast + 0.5) * 255;

      px[i]   = Math.max(0, Math.min(255, r));
      px[i+1] = Math.max(0, Math.min(255, g));
      px[i+2] = Math.max(0, Math.min(255, b));
    }
  }
  cx.putImageData(d, 0, 0);
  const out = new Image();
  return new Promise(res => {
    out.onload = () => res(out);
    out.src = c.toDataURL();
  });
}

/* ============================================================
   SHADOW GENERATION — build a soft, tinted shadow from alpha
   ============================================================ */
function buildShadow(cutout, scene, opacity) {
  const c = document.createElement('canvas');
  c.width = cutout.width;
  c.height = cutout.height;
  const cx = c.getContext('2d');
  cx.drawImage(cutout, 0, 0);

  const d = cx.getImageData(0, 0, c.width, c.height);
  const px = d.data;

  // Shadow color: darken scene colors
  const shR = Math.round(scene.r * 0.25);
  const shG = Math.round(scene.g * 0.25);
  const shB = Math.round(scene.b * 0.25);

  for (let i = 0; i < px.length; i += 4) {
    const a = px[i+3];
    if (a === 0) continue;
    px[i]   = shR;
    px[i+1] = shG;
    px[i+2] = shB;
    px[i+3] = Math.round(a * opacity);
  }
  cx.putImageData(d, 0, 0);
  const out = new Image();
  return new Promise(res => {
    out.onload = () => res(out);
    out.src = c.toDataURL();
  });
}

/* ============================================================
   MAIN RENDER — photorealistic composite
   ============================================================ */
async function render() {
  if (!S.bgReady || !S.cutoutReady) return;
  S.processing = true;
  updateButtons();
  setStatus('Analyzing scene lighting…', 'working');
  setProgress(20);

  // 1. Analyze scene
  const scene = analyzeScene(S.bg);
  S.sceneLight = scene;
  await new Promise(r => setTimeout(r, 60));

  setStatus('Relighting subject…', 'working');
  setProgress(45);

  // 2. Relight the cutout to match scene
  const litCutout = await relightCutout(S.cutout, scene);

  setStatus('Casting shadows…', 'working');
  setProgress(70);

  // 3. Build shadow
  const shadowOpacity = (S.shadowAmt / 100) * 0.85;
  const shadow = shadowOpacity > 0.02 ? await buildShadow(litCutout, scene, shadowOpacity) : null;

  setStatus('Compositing…', 'working');
  setProgress(90);

  // 4. Set canvas to a cinematic 16:10 aspect based on bg
  const W = 1400;
  const H = Math.round(W * (S.bg.height / S.bg.width));
  // But constrain height for aesthetics
  const targetH = Math.min(H, 1000);
  const targetW = Math.round(targetH * (W / H));
  canvas.width = targetW;
  canvas.height = targetH;

  // 5. Draw background (cover)
  drawCover(ctx, S.bg, targetW, targetH);

  // 6. Compute subject size and position
  const cutAspect = litCutout.width / litCutout.height;
  let subjW = targetW * (S.sizePct / 100);
  let subjH = subjW / cutAspect;
  const maxSubjH = targetH * 0.75;
  if (subjH > maxSubjH) { subjH = maxSubjH; subjW = subjH * cutAspect; }

  const subjX = (targetW - subjW) / 2;
  const subjY = targetH * (S.posYPct / 100) - subjH * 0.5;

  // 7. Draw shadow (offset in direction opposite the key light)
  if (shadow) {
    const angleRad = (scene.keyAngle * Math.PI) / 180;
    const offsetX = Math.cos(angleRad + Math.PI) * subjW * 0.02;
    const offsetY = Math.abs(Math.sin(angleRad)) * subjH * 0.03 + subjH * 0.02;
    const scale = 1.02;

    ctx.save();
    ctx.globalAlpha = 1;
    ctx.filter = `blur(${Math.round(subjW * 0.012)}px)`;
    const sw = subjW * scale, sh = subjH * scale;
    const sx = subjX - (sw - subjW) / 2 + offsetX;
    const sy = subjY - (sh - subjH) / 2 + offsetY;
    ctx.drawImage(shadow, sx, sy, sw, sh);
    ctx.restore();
  }

  // 8. Draw the relit subject
  ctx.drawImage(litCutout, subjX, subjY, subjW, subjH);

  // 9. Atmospheric blend — tint background slightly to unify the shot
  ctx.save();
  ctx.globalCompositeOperation = 'overlay';
  const atmos = ctx.createLinearGradient(0, 0, 0, targetH);
  const tintR = Math.round(scene.r), tintG = Math.round(scene.g), tintB = Math.round(scene.b);
  atmos.addColorStop(0, `rgba(${tintR},${tintG},${tintB},0.06)`);
  atmos.addColorStop(1, `rgba(${tintR},${tintG},${tintB},0.02)`);
  ctx.fillStyle = atmos;
  ctx.fillRect(0, 0, targetW, targetH);
  ctx.restore();

  // 10. Subtle vignette
  ctx.save();
  const vig = ctx.createRadialGradient(targetW/2, targetH/2, targetH*0.35, targetW/2, targetH/2, targetH*0.9);
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(1, 'rgba(0,0,0,0.3)');
  ctx.fillStyle = vig;
  ctx.fillRect(0, 0, targetW, targetH);
  ctx.restore();

  // 11. Very subtle film grain for photographic realism
  addGrain(ctx, targetW, targetH, 0.025);

  setProgress(100);
  setTimeout(() => setProgress(0), 400);

  S.lastPNG = canvas.toDataURL('image/png');
  downloadBtn.disabled = false;
  S.processing = false;
  updateButtons();
  setStatus('Composite ready — download or adjust sliders and re-render.', 'done');
}

function drawCover(ctx, img, W, H) {
  const ir = img.width / img.height;
  const cr = W / H;
  let dw, dh, ox, oy;
  if (ir > cr) {
    dh = H; dw = img.width * (H / img.height);
    ox = (W - dw) / 2; oy = 0;
  } else {
    dw = W; dh = img.height * (W / img.width);
    ox = 0; oy = (H - dh) / 2;
  }
  ctx.drawImage(img, ox, oy, dw, dh);
}

function addGrain(ctx, W, H, intensity) {
  const img = ctx.getImageData(0, 0, W, H);
  const d = img.data;
  const amt = intensity * 255;
  for (let i = 0; i < d.length; i += 4) {
    const n = (Math.random() - 0.5) * amt;
    d[i]   = Math.max(0, Math.min(255, d[i]   + n));
    d[i+1] = Math.max(0, Math.min(255, d[i+1] + n));
    d[i+2] = Math.max(0, Math.min(255, d[i+2] + n));
  }
  ctx.putImageData(img, 0, 0);
}

/* ============================================================
   EVENT WIRING
   ============================================================ */

// Background
bgInput.addEventListener('change', async e => {
  const f = e.target.files[0];
  if (!f) return;
  try {
    setStatus('Loading background…', 'working');
    S.bg = await loadImg(f);
    S.bgReady = true;
    bgBox.classList.add('done');
    bgBadge.textContent = `${S.bg.width}×${S.bg.height}`;
    updateButtons();
    setStatus('Background loaded. Now upload the car photo.', 'done');
  } catch (err) {
    setStatus('Background error: ' + err.message, 'error');
  }
});

// Foreground — AI cutout
fgInput.addEventListener('change', async e => {
  const f = e.target.files[0];
  if (!f) return;
  try {
    S.fg = await loadImg(f);
    S.fgReady = true;
    fgBox.classList.add('done');
    fgBadge.textContent = `${S.fg.width}×${S.fg.height}`;

    S.cutout = await runCutout(f);
    S.cutoutReady = true;
    updateButtons();
    setStatus('Subject isolated. Adjust sliders and click Render.', 'done');

    // Auto-render if bg is ready
    if (S.bgReady) setTimeout(render, 300);
  } catch (err) {
    setStatus('Subject error: ' + err.message, 'error');
  }
});

// Presets
document.querySelectorAll('.preset').forEach(p => {
  p.addEventListener('click', () => {
    document.querySelectorAll('.preset').forEach(x => x.classList.remove('active'));
    p.classList.add('active');
    S.preset = p.dataset.preset;
    if (S.bgReady && S.cutoutReady) render();
  });
});

// Sliders
function bindSlider(id, valId, key, fmt = v => v + '%') {
  const s = $(id), v = $(valId);
  s.addEventListener('input', () => {
    S[key] = +s.value;
    v.textContent = fmt(s.value);
  });
  s.addEventListener('change', () => {
    if (S.bgReady && S.cutoutReady) render();
  });
}
bindSlider('sizeSlider', 'sizeVal', 'sizePct');
bindSlider('posYSlider', 'posYVal', 'posYPct');
bindSlider('shadowSlider', 'shadowVal', 'shadowAmt');
bindSlider('blendSlider', 'blendVal', 'blendAmt');
bindSlider('warmSlider', 'warmVal', 'warmth', v => (v > 0 ? '+' : '') + v);

// Buttons
renderBtn.addEventListener('click', render);
downloadBtn.addEventListener('click', () => {
  if (!S.lastPNG) return;
  const a = document.createElement('a');
  a.href = S.lastPNG;
  a.download = `aura-composite-${Date.now()}.png`;
  a.click();
});
resetBtn.addEventListener('click', () => {
  bgInput.value = ''; fgInput.value = '';
  S.bg = S.fg = S.cutout = null;
  S.bgReady = S.fgReady = S.cutoutReady = false;
  S.lastPNG = null;
  bgBox.classList.remove('done'); fgBox.classList.remove('done');
  bgBadge.textContent = 'empty'; fgBadge.textContent = 'empty';
  downloadBtn.disabled = true;
  updateButtons();
  drawPlaceholder();
  setStatus('Reset. Upload both images to begin.');
});

/* ============================================================
   PLACEHOLDER
   ============================================================ */
function drawPlaceholder() {
  canvas.width = 1400;
  canvas.height = 900;
  ctx.fillStyle = '#0d0d10';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#2a2a30';
  ctx.font = '300 32px Inter, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('Photorealistic composite', canvas.width/2, canvas.height/2 - 20);
  ctx.font = '300 18px Inter, sans-serif';
  ctx.fillStyle = '#1f1f24';
  ctx.fillText('Upload a background + car to begin', canvas.width/2, canvas.height/2 + 30);
}
drawPlaceholder();
setStatus('Upload both images to begin.');
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mulanga's Studio</title>
<style>
  * { box-sizing: border-box; font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; }
  body {
    background: #0a0a0c;
    min-height: 100vh;
    margin: 0;
    padding: 24px;
    color: #e8e6e3;
  }
  .app {
    max-width: 1500px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 380px 1fr;
    gap: 24px;
  }
  @media (max-width: 1100px) { .app { grid-template-columns: 1fr; } }

  .brand { grid-column: 1 / -1; padding-bottom: 16px; border-bottom: 1px solid rgba(255,255,255,0.05); margin-bottom: 8px; }
  .brand h1 { font-size: 1.9rem; font-weight: 300; letter-spacing: -0.02em; margin: 0 0 4px 0; color: #fff; }
  .brand h1 span {
    background: linear-gradient(135deg, #ffb347, #ff7e5f);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; font-weight: 700;
  }
  .brand p { margin: 0; font-size: 0.85rem; color: #6b6b72; }

  .sidebar {
    background: #131316; border-radius: 20px; padding: 22px;
    border: 1px solid rgba(255,255,255,0.04); height: fit-content;
  }

  .label {
    font-size: 0.68rem; font-weight: 600; color: #6b6b72;
    text-transform: uppercase; letter-spacing: 0.12em;
    margin: 0 0 10px 0; display: flex; justify-content: space-between; align-items: center;
  }
  .label .badge {
    background: #1f1f24; color: #6b6b72; font-size: 0.6rem;
    padding: 3px 8px; border-radius: 20px; font-weight: 600; text-transform: uppercase;
  }
  .label .badge.ok { background: rgba(46,204,113,0.15); color: #2ecc71; }

  .file-zone {
    display: block; background: #1a1a1f; border: 1.5px dashed rgba(255,255,255,0.1);
    border-radius: 12px; padding: 16px; margin-bottom: 18px; cursor: pointer;
    transition: all 0.2s; text-align: center; position: relative;
  }
  .file-zone:hover { border-color: rgba(255,179,71,0.5); }
  .file-zone.has { border-style: solid; border-color: #2ecc71; }
  .file-zone .icon { font-size: 1.4rem; margin-bottom: 4px; }
  .file-zone .t1 { font-size: 0.82rem; font-weight: 500; color: #e8e6e3; }
  .file-zone .t2 { font-size: 0.7rem; color: #6b6b72; margin-top: 2px; }
  .file-zone input { display: none; }
  .file-zone img { display: none; width: 100%; height: 60px; object-fit: cover; border-radius: 8px; margin-top: 8px; }
  .file-zone.has img { display: block; }
  .file-zone.has .icon { display: none; }

  .preset-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 18px; }
  .preset {
    background: #1a1a1f; border: 1.5px solid rgba(255,255,255,0.06);
    border-radius: 10px; padding: 10px 8px; text-align: center;
    cursor: pointer; transition: all 0.15s; font-size: 0.72rem; color: #9a9aa0;
  }
  .preset .sw { width: 100%; height: 22px; border-radius: 5px; margin-bottom: 5px; }
  .preset:hover { border-color: rgba(255,179,71,0.4); color: #e8e6e3; }
  .preset.active {
    border-color: #ffb347; color: #ffb347; font-weight: 600;
    background: rgba(255,179,71,0.08);
  }

  .slider-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .slider-row label { font-size: 0.72rem; color: #9a9aa0; width: 90px; flex-shrink: 0; }
  .slider-row input[type="range"] {
    flex: 1; -webkit-appearance: none; height: 3px;
    background: #2a2a30; border-radius: 3px; outline: none;
  }
  .slider-row input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 14px; height: 14px;
    background: #ffb347; border-radius: 50%; cursor: pointer;
    box-shadow: 0 0 0 4px rgba(255,179,71,0.15);
  }
  .slider-row input[type="range"]::-moz-range-thumb {
    width: 14px; height: 14px; background: #ffb347;
    border-radius: 50%; cursor: pointer; border: none;
  }
  .slider-row .v { font-size: 0.7rem; color: #6b6b72; width: 42px; text-align: right; }

  .btn {
    width: 100%; padding: 13px; border-radius: 11px; border: none;
    font-size: 0.85rem; font-weight: 600; cursor: pointer;
    transition: all 0.15s; margin-bottom: 8px;
  }
  .btn-primary {
    background: linear-gradient(135deg, #ffb347, #ff7e5f); color: #1a1a1f;
    box-shadow: 0 8px 24px -6px rgba(255,126,95,0.5);
  }
  .btn-primary:hover:not(:disabled) { transform: translateY(-1px); }
  .btn-primary:disabled { opacity: 0.35; cursor: not-allowed; }
  .btn-ghost { background: #1a1a1f; color: #9a9aa0; border: 1px solid rgba(255,255,255,0.06); }
  .btn-ghost:hover:not(:disabled) { background: #222228; color: #e8e6e3; }
  .btn-ghost:disabled { opacity: 0.4; cursor: not-allowed; }

  .stage {
    background: #131316; border-radius: 20px; padding: 18px;
    border: 1px solid rgba(255,255,255,0.04);
    display: flex; flex-direction: column; gap: 12px; min-height: 620px;
  }
  .canvas-wrap {
    flex: 1; display: flex; align-items: center; justify-content: center;
    background: #000; border-radius: 14px; overflow: hidden; min-height: 520px;
  }
  canvas { max-width: 100%; max-height: 72vh; display: block; border-radius: 12px; }
  .status {
    display: flex; align-items: center; gap: 8px;
    font-size: 0.78rem; color: #6b6b72; padding: 0 4px;
  }
  .status .dot { width: 7px; height: 7px; border-radius: 50%; background: #6b6b72; transition: background 0.2s; }
  .status.working .dot { background: #ffb347; animation: pulse 1.2s infinite; }
  .status.done .dot { background: #2ecc71; }
  .status.error .dot { background: #e74c3c; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

  .progress { height: 3px; background: #1a1a1f; border-radius: 3px; overflow: hidden; display: none; }
  .progress.on { display: block; }
  .progress-inner { height: 100%; background: linear-gradient(90deg, #ffb347, #ff7e5f); width: 0%; transition: width 0.3s; }
</style>
</head>
<body>
<div class="app">
  <div class="brand">
    <h1>Mulanga's <span>Studio</span></h1>
    <p>Photorealistic composite engine.</p>
  </div>

  <aside class="sidebar">
    <div class="label">Background <span class="badge" id="bgBadge">empty</span></div>
    <label class="file-zone" id="bgZone">
      <div class="icon">🏞️</div>
      <div class="t1">Choose background</div>
      <div class="t2">Road · city · beach · studio</div>
      <img id="bgThumb" alt="">
      <input type="file" id="bgInput" accept="image/*">
    </label>

    <div class="label">Subject (Car) <span class="badge" id="fgBadge">empty</span></div>
    <label class="file-zone" id="fgZone">
      <div class="icon">🚗</div>
      <div class="t1">Choose car photo</div>
      <div class="t2">Clean side or 3/4 view</div>
      <img id="fgThumb" alt="">
      <input type="file" id="fgInput" accept="image/*">
    </label>

    <div class="label">Scene Lighting</div>
    <div class="preset-grid" id="presetGrid">
      <div class="preset active" data-preset="auto"><div class="sw" style="background:linear-gradient(135deg,#888,#bbb)"></div>Auto Match</div>
      <div class="preset" data-preset="golden"><div class="sw" style="background:linear-gradient(135deg,#ffb347,#ff7e5f)"></div>Golden Hour</div>
      <div class="preset" data-preset="overcast"><div class="sw" style="background:linear-gradient(135deg,#b8c4d0,#e8eef5)"></div>Overcast</div>
      <div class="preset" data-preset="night"><div class="sw" style="background:linear-gradient(135deg,#1a2a4a,#0a0a1a)"></div>Night</div>
      <div class="preset" data-preset="studio"><div class="sw" style="background:linear-gradient(135deg,#f0f0f0,#c0c0c0)"></div>Studio</div>
      <div class="preset" data-preset="dramatic"><div class="sw" style="background:linear-gradient(135deg,#e67e22,#8b1a1a)"></div>Dramatic</div>
    </div>

    <div class="label">Fine Tune</div>
    <div class="slider-row"><label>Subject size</label><input type="range" id="size" min="25" max="100" value="62"><span class="v" id="sizeV">62%</span></div>
    <div class="slider-row"><label>Vertical pos</label><input type="range" id="posY" min="0" max="100" value="70"><span class="v" id="posYV">70%</span></div>
    <div class="slider-row"><label>Shadow</label><input type="range" id="shadow" min="0" max="100" value="55"><span class="v" id="shadowV">55%</span></div>
    <div class="slider-row"><label>Light blend</label><input type="range" id="blend" min="0" max="100" value="40"><span class="v" id="blendV">40%</span></div>
    <div class="slider-row"><label>Warmth</label><input type="range" id="warm" min="-50" max="50" value="0"><span class="v" id="warmV">0</span></div>

    <button class="btn btn-primary" id="renderBtn" disabled>Render Composite</button>
    <button class="btn btn-ghost" id="downloadBtn" disabled>Download PNG</button>
    <button class="btn btn-ghost" id="resetBtn">Reset</button>
  </aside>

  <main class="stage">
    <div class="canvas-wrap"><canvas id="canvas" width="1400" height="900"></canvas></div>
    <div class="progress" id="progress"><div class="progress-inner" id="progressInner"></div></div>
    <div class="status" id="status"><span class="dot"></span><span id="statusText">Upload both images to begin.</span></div>
  </main>
</div>

<script>
(function() {
  'use strict';

  /* ============================================================
     STATE
     ============================================================ */
  var S = {
    bg: null, fg: null, cutout: null,
    bgReady: false, fgReady: false, cutoutReady: false,
    preset: 'auto',
    sizePct: 62, posYPct: 70, shadowAmt: 55, blendAmt: 40, warmth: 0,
    processing: false, lastPNG: null,
    scene: { r: 200, g: 200, b: 200, keyAngle: -45 }
  };

  /* ============================================================
     DOM
     ============================================================ */
  function $(id) { return document.getElementById(id); }
  var bgInput = $('bgInput'), fgInput = $('fgInput');
  var bgZone = $('bgZone'), fgZone = $('fgZone');
  var bgThumb = $('bgThumb'), fgThumb = $('fgThumb');
  var bgBadge = $('bgBadge'), fgBadge = $('fgBadge');
  var renderBtn = $('renderBtn'), downloadBtn = $('downloadBtn'), resetBtn = $('resetBtn');
  var canvas = $('canvas'), ctx = canvas.getContext('2d', { willReadFrequently: true });
  var statusEl = $('status'), statusText = $('statusText');
  var progressEl = $('progress'), progressInner = $('progressInner');

  /* ============================================================
     UI
     ============================================================ */
  function setStatus(text, kind) {
    statusText.textContent = text;
    statusEl.className = 'status' + (kind ? ' ' + kind : '');
  }
  function setProgress(pct) {
    if (pct > 0 && pct < 100) {
      progressEl.classList.add('on');
      progressInner.style.width = pct + '%';
    } else {
      progressEl.classList.remove('on');
      progressInner.style.width = '0%';
    }
  }
  function updateButtons() {
    renderBtn.disabled = !(S.bgReady && S.cutoutReady) || S.processing;
    downloadBtn.disabled = !S.lastPNG;
  }

  /* ============================================================
     IMAGE LOADING
     ============================================================ */
  function loadImageFromFile(file) {
    return new Promise(function(resolve, reject) {
      if (!file || !file.type || file.type.indexOf('image/') !== 0) {
        reject(new Error('Not a valid image file'));
        return;
      }
      var reader = new FileReader();
      reader.onload = function(e) {
        var img = new Image();
        img.onload = function() { resolve(img); };
        img.onerror = function() { reject(new Error('Image decode failed')); };
        img.src = e.target.result;
      };
      reader.onerror = function() { reject(new Error('File read failed')); };
      reader.readAsDataURL(file);
    });
  }

  function imageFromDataURL(dataURL) {
    return new Promise(function(resolve, reject) {
      var img = new Image();
      img.onload = function() { resolve(img); };
      img.onerror = function() { reject(new Error('DataURL load failed')); };
      img.src = dataURL;
    });
  }

  /* ============================================================
     FAST BUILT-IN CUTOUT (always works)
     Uses color-distance from corner samples + edge feathering.
     ============================================================ */
  function fastCutout(img) {
    var maxDim = 1400;
    var w = img.width, h = img.height;
    if (Math.max(w, h) > maxDim) {
      var s = maxDim / Math.max(w, h);
      w = Math.round(w * s);
      h = Math.round(h * s);
    }

    var c = document.createElement('canvas');
    c.width = w; c.height = h;
    var cx = c.getContext('2d', { willReadFrequently: true });
    cx.drawImage(img, 0, 0, w, h);

    var id = cx.getImageData(0, 0, w, h);
    var px = id.data;

    // Sample background from 12 points: 4 corners, 4 edge midpoints, 4 near corners
    var pts = [
      [0,0],[w-1,0],[0,h-1],[w-1,h-1],
      [Math.floor(w/2),0],[Math.floor(w/2),h-1],
      [0,Math.floor(h/2)],[w-1,Math.floor(h/2)],
      [Math.floor(w*0.15),Math.floor(h*0.1)],
      [Math.floor(w*0.85),Math.floor(h*0.1)],
      [Math.floor(w*0.15),Math.floor(h*0.9)],
      [Math.floor(w*0.85),Math.floor(h*0.9)]
    ];
    var r0 = 0, g0 = 0, b0 = 0;
    for (var p = 0; p < pts.length; p++) {
      var pi = (pts[p][1] * w + pts[p][0]) * 4;
      r0 += px[pi]; g0 += px[pi+1]; b0 += px[pi+2];
    }
    r0 /= pts.length; g0 /= pts.length; b0 /= pts.length;

    // Multi-threshold: pixels close to bg color become transparent
    var hard = 50, feather = 40;
    for (var i = 0; i < px.length; i += 4) {
      var dr = px[i] - r0, dg = px[i+1] - g0, db = px[i+2] - b0;
      var dist = Math.sqrt(dr*dr + dg*dg + db*db);
      if (dist < hard) {
        px[i+3] = 0;
      } else if (dist < hard + feather) {
        px[i+3] = Math.round(px[i+3] * (dist - hard) / feather);
      }
    }

    // Clean up isolated noise: single-pass median-like filter on alpha
    var alphaCopy = new Uint8ClampedArray(w * h);
    for (var j = 0; j < w * h; j++) alphaCopy[j] = px[j * 4 + 3];
    for (var y = 1; y < h - 1; y++) {
      for (var x = 1; x < w - 1; x++) {
        var idx = y * w + x;
        var sum = 0;
        for (var dy = -1; dy <= 1; dy++) {
          for (var dx = -1; dx <= 1; dx++) {
            sum += alphaCopy[(y + dy) * w + (x + dx)];
          }
        }
        var avg = sum / 9;
        // Sharpen: if a pixel's alpha is far from its neighborhood, pull it toward the average
        var orig = px[idx * 4 + 3];
        px[idx * 4 + 3] = Math.round(orig * 0.35 + avg * 0.65);
      }
    }

    cx.putImageData(id, 0, 0);
    return imageFromDataURL(c.toDataURL('image/png'));
  }

  /* ============================================================
     SCENE ANALYSIS
     ============================================================ */
  function analyzeScene(img) {
    var w = 80, h = 80;
    var c = document.createElement('canvas');
    c.width = w; c.height = h;
    var cx = c.getContext('2d');
    cx.drawImage(img, 0, 0, w, h);
    var d = cx.getImageData(0, 0, w, h).data;

    var rS = 0, gS = 0, bS = 0, lS = 0;
    var topL = 0, topN = 0, botL = 0, botN = 0, leftL = 0, leftN = 0, rightL = 0, rightN = 0;
    var n = w * h;

    for (var y = 0; y < h; y++) {
      for (var x = 0; x < w; x++) {
        var i = (y * w + x) * 4;
        var r = d[i], g = d[i+1], b = d[i+2];
        var lum = 0.299 * r + 0.587 * g + 0.114 * b;
        rS += r; gS += g; bS += b; lS += lum;
        if (y < h/3) { topL += lum; topN++; }
        if (y > 2*h/3) { botL += lum; botN++; }
        if (x < w/3) { leftL += lum; leftN++; }
        if (x > 2*w/3) { rightL += lum; rightN++; }
      }
    }
    var avgR = rS / n, avgG = gS / n, avgB = bS / n;
    var top = topL/topN, bot = botL/botN, left = leftL/leftN, right = rightL/rightN;
    var quads = [
      { v: (top+left)/2, a: -135 },
      { v: (top+right)/2, a: -45 },
      { v: (bot+left)/2, a: 135 },
      { v: (bot+right)/2, a: 45 }
    ].sort(function(a,b) { return b.v - a.v; });

    return { r: avgR, g: avgG, b: avgB, keyAngle: quads[0].a };
  }

  /* ============================================================
     RELIGHTING
     ============================================================ */
  function relight(cutout, scene) {
    var c = document.createElement('canvas');
    c.width = cutout.width; c.height = cutout.height;
    var cx = c.getContext('2d', { willReadFrequently: true });
    cx.drawImage(cutout, 0, 0);
    var id = cx.getImageData(0, 0, c.width, c.height);
    var px = id.data;

    var tR = scene.r, tG = scene.g, tB = scene.b, bright = 1.0, keyA = scene.keyAngle;

    switch (S.preset) {
      case 'golden':   tR=255; tG=195; tB=130; bright=1.10; keyA=-55; break;
      case 'overcast': tR=205; tG=215; tB=228; bright=0.92; keyA=-90; break;
      case 'night':    tR=45;  tG=65;  tB=130; bright=0.50; keyA=-25; break;
      case 'studio':   tR=245; tG=245; tB=245; bright=1.00; keyA=-45; break;
      case 'dramatic': tR=210; tG=140; tB=85;  bright=0.82; keyA=-120; break;
    }

    var tint = (S.preset === 'auto' ? 0.35 : 0.55) * (S.blendAmt / 100 + 0.35);
    var rad = (keyA * Math.PI) / 180;
    var lx = Math.cos(rad), ly = Math.sin(rad);
    var w = c.width, h = c.height;

    for (var y = 0; y < h; y++) {
      for (var x = 0; x < w; x++) {
        var i = (y * w + x) * 4;
        if (px[i+3] === 0) continue;

        var nx = (x / w) - 0.5, ny = (y / h) - 0.5;
        var facing = (nx * lx + ny * ly) + 0.5;
        var shade = 0.62 + facing * 0.58;

        var r = px[i] * shade;
        var g = px[i+1] * shade;
        var b = px[i+2] * shade;

        r = r * (1 - tint) + tR * tint * (r / 255);
        g = g * (1 - tint) + tG * tint * (g / 255);
        b = b * (1 - tint) + tB * tint * (b / 255);

        r *= bright; g *= bright; b *= bright;

        var wm = S.warmth / 100;
        r *= (1 + wm * 0.45);
        g *= (1 + wm * 0.10);
        b *= (1 - wm * 0.45);

        var con = 1.09;
        r = ((r/255 - 0.5) * con + 0.5) * 255;
        g = ((g/255 - 0.5) * con + 0.5) * 255;
        b = ((b/255 - 0.5) * con + 0.5) * 255;

        px[i]   = Math.max(0, Math.min(255, r));
        px[i+1] = Math.max(0, Math.min(255, g));
        px[i+2] = Math.max(0, Math.min(255, b));
      }
    }
    cx.putImageData(id, 0, 0);
    return imageFromDataURL(c.toDataURL('image/png'));
  }

  /* ============================================================
     SHADOW
     ============================================================ */
  function buildShadow(cutout, scene, opacity) {
    var c = document.createElement('canvas');
    c.width = cutout.width; c.height = cutout.height;
    var cx = c.getContext('2d');
    cx.drawImage(cutout, 0, 0);
    var id = cx.getImageData(0, 0, c.width, c.height);
    var px = id.data;

    var shR = Math.round(scene.r * 0.22);
    var shG = Math.round(scene.g * 0.22);
    var shB = Math.round(scene.b * 0.22);

    for (var i = 0; i < px.length; i += 4) {
      if (px[i+3] === 0) continue;
      px[i]   = shR;
      px[i+1] = shG;
      px[i+2] = shB;
      px[i+3] = Math.round(px[i+3] * opacity);
    }
    cx.putImageData(id, 0, 0);
    return imageFromDataURL(c.toDataURL('image/png'));
  }

  /* ============================================================
     GRAIN
     ============================================================ */
  function addGrain(W, H, intensity) {
    var img = ctx.getImageData(0, 0, W, H);
    var d = img.data;
    var amt = intensity * 255;
    for (var i = 0; i < d.length; i += 4) {
      var n = (Math.random() - 0.5) * amt;
      d[i]   = Math.max(0, Math.min(255, d[i]   + n));
      d[i+1] = Math.max(0, Math.min(255, d[i+1] + n));
      d[i+2] = Math.max(0, Math.min(255, d[i+2] + n));
    }
    ctx.putImageData(img, 0, 0);
  }

  /* ============================================================
     DRAW COVER
     ============================================================ */
  function drawCover(img, W, H) {
    var ir = img.width / img.height;
    var cr = W / H;
    var dw, dh, ox, oy;
    if (ir > cr) {
      dh = H; dw = img.width * (H / img.height);
      ox = (W - dw) / 2; oy = 0;
    } else {
      dw = W; dh = img.height * (W / img.width);
      ox = 0; oy = (H - dh) / 2;
    }
    ctx.drawImage(img, ox, oy, dw, dh);
  }

  /* ============================================================
     MAIN RENDER
     ============================================================ */
  function render() {
    if (!S.bgReady || !S.cutoutReady) return;
    S.processing = true;
    updateButtons();

    try {
      setStatus('Analyzing scene…', 'working');
      setProgress(15);
      var scene = analyzeScene(S.bg);
      S.scene = scene;

      setStatus('Relighting subject…', 'working');
      setProgress(40);
      var lit = S.cutout; // will be replaced async below

      // Do the heavy work asynchronously via Promise chain
      relight(S.cutout, scene).then(function(litImg) {
        setStatus('Casting shadows…', 'working');
        setProgress(65);
        var shadowOpacity = (S.shadowAmt / 100) * 0.85;
        var shadowPromise = shadowOpacity > 0.02
          ? buildShadow(litImg, scene, shadowOpacity)
          : Promise.resolve(null);

        shadowPromise.then(function(shadowImg) {
          setStatus('Compositing…', 'working');
          setProgress(85);

          // Canvas size
          var maxW = 1400;
          var W = S.bg.width, H = S.bg.height;
          if (W > maxW) { H = Math.round(H * (maxW / W)); W = maxW; }
          canvas.width = W;
          canvas.height = H;

          drawCover(S.bg, W, H);

          var ar = litImg.width / litImg.height;
          var sw = W * (S.sizePct / 100);
          var sh = sw / ar;
          var maxSH = H * 0.78;
          if (sh > maxSH) { sh = maxSH; sw = sh * ar; }
          var sx = (W - sw) / 2;
          var sy = H * (S.posYPct / 100) - sh * 0.5;

          if (shadowImg) {
            var rad = (scene.keyAngle * Math.PI) / 180;
            var offX = Math.cos(rad + Math.PI) * sw * 0.02;
            var offY = Math.abs(Math.sin(rad)) * sh * 0.03 + sh * 0.025;
            var sc = 1.02;
            var dw = sw * sc, dh = sh * sc;
            var dx = sx - (dw - sw) / 2 + offX;
            var dy = sy - (dh - sh) / 2 + offY;
            ctx.save();
            ctx.filter = 'blur(' + Math.max(6, Math.round(sw * 0.013)) + 'px)';
            ctx.drawImage(shadowImg, dx, dy, dw, dh);
            ctx.restore();
          }

          ctx.drawImage(litImg, sx, sy, sw, sh);

          // Atmospheric tint
          ctx.save();
          ctx.globalCompositeOperation = 'overlay';
          var grad = ctx.createLinearGradient(0, 0, 0, H);
          grad.addColorStop(0, 'rgba(' + (scene.r|0) + ',' + (scene.g|0) + ',' + (scene.b|0) + ',0.05)');
          grad.addColorStop(1, 'rgba(' + (scene.r|0) + ',' + (scene.g|0) + ',' + (scene.b|0) + ',0.02)');
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, W, H);
          ctx.restore();

          // Vignette
          ctx.save();
          var vig = ctx.createRadialGradient(W/2, H/2, H*0.35, W/2, H/2, H*0.95);
          vig.addColorStop(0, 'rgba(0,0,0,0)');
          vig.addColorStop(1, 'rgba(0,0,0,0.32)');
          ctx.fillStyle = vig;
          ctx.fillRect(0, 0, W, H);
          ctx.restore();

          addGrain(W, H, 0.025);

          setProgress(100);
          setTimeout(function() { setProgress(0); }, 400);

          S.lastPNG = canvas.toDataURL('image/png');
          downloadBtn.disabled = false;
          setStatus('Composite ready. Download or tweak.', 'done');
          setStatus2(W + '×' + H + ' · ' + S.preset);
        }).catch(function(err) {
          console.error(err);
          setStatus('Shadow error: ' + err.message, 'error');
        }).then(function() {
          S.processing = false;
          updateButtons();
        });
      }).catch(function(err) {
        console.error(err);
        setStatus('Render error: ' + err.message, 'error');
        S.processing = false;
        updateButtons();
      });
    } catch (err) {
      console.error(err);
      setStatus('Render error: ' + err.message, 'error');
      S.processing = false;
      updateButtons();
    }
  }

  // Status meta display (optional, appended to status text)
  function setStatus2(meta) {
    // Just append to the status text for now
    // (could add a separate meta element)
    statusText.textContent = 'Composite ready · ' + meta;
  }

  /* ============================================================
     PLACEHOLDER
     ============================================================ */
  function drawPlaceholder() {
    canvas.width = 1400;
    canvas.height = 900;
    var g = ctx.createLinearGradient(0, 0, 1400, 900);
    g.addColorStop(0, '#0d0d10');
    g.addColorStop(1, '#14141a');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, 1400, 900);
    ctx.fillStyle = '#2a2a30';
    ctx.font = '300 40px Inter, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText("Mulanga's Studio", 700, 400);
    ctx.font = '300 18px Inter, sans-serif';
    ctx.fillStyle = '#1f1f24';
    ctx.fillText('Upload a background + car photo to begin', 700, 450);
  }

  /* ============================================================
     EVENT: BACKGROUND
     ============================================================ */
  bgInput.addEventListener('change', function(e) {
    var f = e.target.files[0];
    if (!f) return;
    setStatus('Loading background…', 'working');
    loadImageFromFile(f).then(function(img) {
      S.bg = img;
      S.bgReady = true;
      bgZone.classList.add('has');
      bgThumb.src = img.src;
      bgBadge.textContent = img.width + '×' + img.height;
      bgBadge.classList.add('ok');
      setStatus('Background loaded. Upload the car next.', 'done');
      updateButtons();
      if (S.cutoutReady) render();
    }).catch(function(err) {
      setStatus('Background error: ' + err.message, 'error');
    });
  });

  /* ============================================================
     EVENT: FOREGROUND (with built-in cutout)
     ============================================================ */
  fgInput.addEventListener('change', function(e) {
    var f = e.target.files[0];
    if (!f) return;
    setStatus('Loading car photo…', 'working');
    setProgress(10);

    loadImageFromFile(f).then(function(img) {
      S.fg = img;
      S.fgReady = true;
      fgZone.classList.add('has');
      fgThumb.src = img.src;
      fgBadge.textContent = img.width + '×' + img.height;
      fgBadge.classList.add('ok');

      setStatus('Isolating subject…', 'working');
      setProgress(40);

      return fastCutout(img);
    }).then(function(cutout) {
      S.cutout = cutout;
      S.cutoutReady = true;
      setProgress(100);
      setTimeout(function() { setProgress(0); }, 400);
      setStatus('Subject ready. Rendering composite…', 'done');
      updateButtons();
      if (S.bgReady) setTimeout(render, 150);
      else setStatus('Subject ready. Upload the background next.', 'done');
    }).catch(function(err) {
      console.error(err);
      setStatus('Subject error: ' + err.message, 'error');
      setProgress(0);
    });
  });

  /* ============================================================
     EVENT: PRESETS
     ============================================================ */
  var presetEls = document.querySelectorAll('.preset');
  for (var i = 0; i < presetEls.length; i++) {
    (function(el) {
      el.addEventListener('click', function() {
        for (var k = 0; k < presetEls.length; k++) presetEls[k].classList.remove('active');
        el.classList.add('active');
        S.preset = el.getAttribute('data-preset');
        if (S.bgReady && S.cutoutReady) render();
      });
    })(presetEls[i]);
  }

  /* ============================================================
     EVENT: SLIDERS
     ============================================================ */
  function bindSlider(id, valId, key, fmt) {
    var s = $(id), v = $(valId);
    function update() {
      S[key] = +s.value;
      v.textContent = fmt ? fmt(s.value) : (s.value + '%');
    }
    s.addEventListener('input', update);
    s.addEventListener('change', function() { if (S.bgReady && S.cutoutReady) render(); });
    update();
  }
  bindSlider('size', 'sizeV', 'sizePct');
  bindSlider('posY', 'posYV', 'posYPct');
  bindSlider('shadow', 'shadowV', 'shadowAmt');
  bindSlider('blend', 'blendV', 'blendAmt');
  bindSlider('warm', 'warmV', 'warmth', function(v) { return (v > 0 ? '+' : '') + v; });

  /* ============================================================
     EVENT: BUTTONS
     ============================================================ */
  renderBtn.addEventListener('click', render);

  downloadBtn.addEventListener('click', function() {
    if (!S.lastPNG) return;
    var a = document.createElement('a');
    a.href = S.lastPNG;
    a.download = "mulangas-studio-" + S.preset + "-" + Date.now() + ".png";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setStatus('Downloaded.', 'done');
  });

  resetBtn.addEventListener('click', function() {
    bgInput.value = ''; fgInput.value = '';
    S.bg = S.fg = S.cutout = null;
    S.bgReady = S.fgReady = S.cutoutReady = false;
    S.lastPNG = null;
    bgZone.classList.remove('has');
    fgZone.classList.remove('has');
    bgThumb.src = ''; fgThumb.src = '';
    bgBadge.textContent = 'empty'; bgBadge.classList.remove('ok');
    fgBadge.textContent = 'empty'; fgBadge.classList.remove('ok');
    drawPlaceholder();
    setStatus('Reset. Upload both images to begin.');
    updateButtons();
  });

  /* ============================================================
     INIT
     ============================================================ */
  drawPlaceholder();
  setStatus('Upload both images to begin.');
  updateButtons();
  console.log("Mulanga's Studio ready.");

})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mulangas Studios · Photorealistic Composite</title>
<style>
  * { box-sizing: border-box; font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; }
  body {
    background: #0a0a0c;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
    color: #e8e6e3;
  }
  .app {
    max-width: 1500px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 400px 1fr;
    gap: 24px;
  }
  @media (max-width: 1100px) { .app { grid-template-columns: 1fr; } }

  /* ---------- HEADER ---------- */
  .brand {
    grid-column: 1 / -1;
    padding: 4px 0 20px 0;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    margin-bottom: 20px;
  }
  .brand h1 {
    font-size: 2rem;
    font-weight: 300;
    letter-spacing: -0.03em;
    margin: 0 0 4px 0;
    color: #fff;
  }
  .brand h1 span {
    background: linear-gradient(135deg, #ffb347, #ff7e5f, #e74c3c);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: 700;
  }
  .brand p {
    margin: 0;
    font-size: 0.85rem;
    color: #6b6b72;
  }

  /* ---------- SIDEBAR ---------- */
  .sidebar {
    background: #131316;
    border-radius: 20px;
    padding: 24px;
    border: 1px solid rgba(255,255,255,0.04);
    height: fit-content;
    position: sticky;
    top: 20px;
  }

  .section-label {
    font-size: 0.68rem;
    font-weight: 600;
    color: #6b6b72;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    margin: 0 0 12px 0;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-label .num {
    width: 18px; height: 18px;
    background: #ffb347;
    color: #1a1a1f;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 0.65rem;
    font-weight: 700;
  }

  .upload {
    display: block;
    background: #1a1a1f;
    border: 1.5px dashed rgba(255,255,255,0.1);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 20px;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
  }
  .upload:hover { border-color: rgba(255,179,71,0.5); background: #1d1d23; }
  .upload.has-file { border-style: solid; border-color: #2ecc71; background: rgba(46,204,113,0.05); }
  .upload .icon { font-size: 1.6rem; margin-bottom: 6px; }
  .upload .title { font-size: 0.85rem; font-weight: 500; color: #e8e6e3; margin-bottom: 2px; }
  .upload .sub { font-size: 0.72rem; color: #6b6b72; }
  .upload input { display: none; }

  .thumb-preview {
    display: none;
    width: 100%;
    height: 70px;
    object-fit: cover;
    border-radius: 8px;
    margin-top: 10px;
  }
  .upload.has-file .thumb-preview { display: block; }
  .upload.has-file .icon { display: none; }

  /* ---------- PRESETS ---------- */
  .preset-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 20px;
  }
  .preset {
    background: #1a1a1f;
    border: 1.5px solid rgba(255,255,255,0.06);
    border-radius: 10px;
    padding: 12px 8px;
    text-align: center;
    cursor: pointer;
    transition: all 0.15s;
    font-size: 0.75rem;
    color: #9a9aa0;
    position: relative;
    overflow: hidden;
  }
  .preset .swatch {
    width: 100%;
    height: 24px;
    border-radius: 5px;
    margin-bottom: 6px;
  }
  .preset:hover { border-color: rgba(255,179,71,0.4); color: #e8e6e3; }
  .preset.active {
    border-color: #ffb347;
    color: #ffb347;
    font-weight: 600;
    background: rgba(255,179,71,0.08);
  }

  /* ---------- SLIDERS ---------- */
  .sliders { margin-bottom: 20px; }
  .slider-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }
  .slider-row label {
    font-size: 0.72rem;
    color: #9a9aa0;
    width: 90px;
    flex-shrink: 0;
  }
  .slider-row input[type="range"] {
    flex: 1;
    -webkit-appearance: none;
    height: 3px;
    background: #2a2a30;
    border-radius: 3px;
    outline: none;
  }
  .slider-row input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    background: #ffb347;
    border-radius: 50%;
    cursor: pointer;
    box-shadow: 0 0 0 4px rgba(255,179,71,0.15);
  }
  .slider-row input[type="range"]::-moz-range-thumb {
    width: 14px; height: 14px;
    background: #ffb347;
    border-radius: 50%;
    cursor: pointer;
    border: none;
  }
  .slider-row .val {
    font-size: 0.7rem;
    color: #6b6b72;
    width: 42px;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  /* ---------- BUTTONS ---------- */
  .btn {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: none;
    font-size: 0.88rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .btn-primary {
    background: linear-gradient(135deg, #ffb347, #ff7e5f);
    color: #1a1a1f;
    box-shadow: 0 8px 24px -6px rgba(255,126,95,0.5);
  }
  .btn-primary:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 12px 32px -6px rgba(255,126,95,0.6); }
  .btn-primary:disabled { opacity: 0.35; cursor: not-allowed; }
  .btn-ghost {
    background: #1a1a1f;
    color: #9a9aa0;
    border: 1px solid rgba(255,255,255,0.06);
  }
  .btn-ghost:hover:not(:disabled) { background: #222228; color: #e8e6e3; }
  .btn-ghost:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ---------- CANVAS ---------- */
  .stage {
    background: #131316;
    border-radius: 20px;
    padding: 20px;
    border: 1px solid rgba(255,255,255,0.04);
    display: flex;
    flex-direction: column;
    gap: 14px;
    min-height: 620px;
  }
  .canvas-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    border-radius: 14px;
    overflow: hidden;
    min-height: 520px;
  }
  canvas {
    max-width: 100%;
    max-height: 72vh;
    display: block;
    border-radius: 14px;
  }
  .status-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 0.78rem;
    color: #6b6b72;
    padding: 0 4px;
  }
  .status-bar .left { display: flex; align-items: center; gap: 8px; }
  .status-bar .dot {
    width: 7px; height: 7px; border-radius: 50%; background: #6b6b72;
    transition: background 0.2s;
  }
  .status-bar.working .dot { background: #ffb347; animation: pulse 1.2s infinite; }
  .status-bar.done .dot { background: #2ecc71; }
  .status-bar.error .dot { background: #e74c3c; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

  .progress {
    height: 3px;
    background: #1a1a1f;
    border-radius: 3px;
    overflow: hidden;
    display: none;
  }
  .progress.active { display: block; }
  .progress-inner {
    height: 100%;
    background: linear-gradient(90deg, #ffb347, #ff7e5f);
    width: 0%;
    transition: width 0.3s;
  }
</style>

<body>

  <!-- SIDEBAR -->

  <!-- STAGE -->

<!-- AI library (optional) -->
<script type="module">
// Try to load the AI library, but don't fail hard if it doesn't work
let removeBackground = null;
try {
  const mod = await import('https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.4.5/dist/index.mjs');
  removeBackground = mod.removeBackground;
  console.log('✓ AI background removal loaded');
} catch (e) {
  console.warn('AI library unavailable, using fallback cutout:', e.message);
}

/* ============================================================
   STATE
   ============================================================ */
const S = {
  bg: null, fg: null, cutout: null,
  bgReady: false, fgReady: false, cutoutReady: false,
  preset: 'auto',
  sizePct: 60, posYPct: 72, shadowAmt: 60, blendAmt: 45, warmth: 0, grain: 30,
  processing: false, lastPNG: null,
  scene: { r: 200, g: 200, b: 200, brightness: 0.5, warmth: 0, keyAngle: -45 }
};

/* ============================================================
   DOM
   ============================================================ */
const $ = id => document.getElementById(id);
const bgInput = $('bgInput'), fgInput = $('fgInput');
const bgUpload = $('bgUpload'), fgUpload = $('fgUpload');
const bgThumb = $('bgThumb'), fgThumb = $('fgThumb');
const renderBtn = $('renderBtn'), downloadBtn = $('downloadBtn'), resetBtn = $('resetBtn');
const canvas = $('canvas'), ctx = canvas.getContext('2d', { willReadFrequently: true });
const statusBar = $('statusBar'), statusText = $('statusText'), statusMeta = $('statusMeta');
const progressEl = $('progress'), progressInner = $('progressInner');

/* ============================================================
   UI HELPERS
   ============================================================ */
function setStatus(text, kind = '') {
  statusText.textContent = text;
  statusBar.className = 'status-bar' + (kind ? ' ' + kind : '');
}
function setMeta(text) { statusMeta.textContent = text; }
function setProgress(pct) {
  if (pct > 0 && pct < 100) {
    progressEl.classList.add('active');
    progressInner.style.width = pct + '%';
  } else {
    progressEl.classList.remove('active');
    progressInner.style.width = '0%';
  }
}
function updateButtons() {
  renderBtn.disabled = !(S.bgReady && S.cutoutReady) || S.processing;
  downloadBtn.disabled = !S.lastPNG;
}

/* ============================================================
   IMAGE LOADING
   ============================================================ */
function loadImg(fileOrUrl) {
  return new Promise((res, rej) => {
    const i = new Image();
    i.crossOrigin = 'anonymous';
    i.onload = () => res(i);
    i.onerror = () => rej(new Error('Image load failed'));
    if (fileOrUrl instanceof File) {
      const r = new FileReader();
      r.onload = e => { i.src = e.target.result; };
      r.onerror = () => rej(new Error('Read failed'));
      r.readAsDataURL(fileOrUrl);
    } else {
      i.src = fileOrUrl;
    }
  });
}

/* ============================================================
   FALLBACK CUTOUT (fast corner-based keying + edge refinement)
   Used when AI is unavailable or fails.
   ============================================================ */
async function fallbackCutout(img) {
  const c = document.createElement('canvas');
  const maxDim = 1200;
  let w = img.width, h = img.height;
  if (Math.max(w, h) > maxDim) {
    const s = maxDim / Math.max(w, h);
    w = Math.round(w * s); h = Math.round(h * s);
  }
  c.width = w; c.height = h;
  const cx = c.getContext('2d', { willReadFrequently: true });
  cx.drawImage(img, 0, 0, w, h);

  const id = cx.getImageData(0, 0, w, h);
  const px = id.data;

  // Sample background from all 4 corners + edge midpoints
  const samples = [
    [0,0], [w-1,0], [0,h-1], [w-1,h-1],
    [Math.floor(w/2), 0], [Math.floor(w/2), h-1],
    [0, Math.floor(h/2)], [w-1, Math.floor(h/2)]
  ];
  let r0=0,g0=0,b0=0;
  samples.forEach(([x,y]) => {
    const i = (y*w + x) * 4;
    r0 += px[i]; g0 += px[i+1]; b0 += px[i+2];
  });
  r0 /= samples.length; g0 /= samples.length; b0 /= samples.length;

  // Distance threshold with feather
  const hard = 55, feather = 35;
  for (let i = 0; i < px.length; i += 4) {
    const dr = px[i] - r0, dg = px[i+1] - g0, db = px[i+2] - b0;
    const dist = Math.sqrt(dr*dr + dg*dg + db*db);
    if (dist < hard) {
      px[i+3] = 0;
    } else if (dist < hard + feather) {
      px[i+3] = Math.round(px[i+3] * (dist - hard) / feather);
    }
  }
  cx.putImageData(id, 0, 0);

  // Return as Image
  return loadImg(c.toDataURL('image/png'));
}

/* ============================================================
   AI CUTOUT (with timeout + fallback)
   ============================================================ */
async function aiCutout(file) {
  if (!removeBackground) throw new Error('AI not loaded');
  const timeoutMs = 45000;
  const blob = await Promise.race([
    removeBackground(file, {
      progress: (k, cur, tot) => {
        const pct = Math.round((cur / tot) * 90) + 5;
        setProgress(pct);
      }
    }),
    new Promise((_, rej) => setTimeout(() => rej(new Error('AI timeout')), timeoutMs))
  ]);
  return loadImg(URL.createObjectURL(blob));
}

/* ============================================================
   SCENE ANALYSIS
   ============================================================ */
function analyzeScene(img) {
  const w = 80, h = 80;
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const cx = c.getContext('2d');
  cx.drawImage(img, 0, 0, w, h);
  const d = cx.getImageData(0, 0, w, h).data;

  let rS=0,gS=0,bS=0,lS=0;
  let topL=0, topN=0, botL=0, botN=0, leftL=0, leftN=0, rightL=0, rightN=0;
  const n = w * h;

  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const i = (y*w + x) * 4;
      const r = d[i], g = d[i+1], b = d[i+2];
      const lum = 0.299*r + 0.587*g + 0.114*b;
      rS += r; gS += g; bS += b; lS += lum;
      if (y < h/3) { topL += lum; topN++; }
      if (y > 2*h/3) { botL += lum; botN++; }
      if (x < w/3) { leftL += lum; leftN++; }
      if (x > 2*w/3) { rightL += lum; rightN++; }
    }
  }
  const avgR = rS/n, avgG = gS/n, avgB = bS/n;
  const avgLum = lS/n;
  const top = topL/topN, bot = botL/botN;
  const left = leftL/leftN, right = rightL/rightN;

  const quads = [
    { v: (top+left)/2, a: -135 },
    { v: (top+right)/2, a: -45 },
    { v: (bot+left)/2, a: 135 },
    { v: (bot+right)/2, a: 45 }
  ].sort((a,b) => b.v - a.v);

  return {
    r: avgR, g: avgG, b: avgB,
    brightness: avgLum / 255,
    warmth: (avgR - avgB) / 255,
    keyAngle: quads[0].a
  };
}

/* ============================================================
   RELIGHTING
   ============================================================ */
async function relight(cutout, scene) {
  const c = document.createElement('canvas');
  c.width = cutout.width; c.height = cutout.height;
  const cx = c.getContext('2d', { willReadFrequently: true });
  cx.drawImage(cutout, 0, 0);
  const id = cx.getImageData(0, 0, c.width, c.height);
  const px = id.data;

  let tR = scene.r, tG = scene.g, tB = scene.b, bright = 1.0, keyA = scene.keyAngle;

  switch (S.preset) {
    case 'golden':   tR=255; tG=195; tB=130; bright=1.10; keyA=-55; break;
    case 'overcast': tR=205; tG=215; tB=228; bright=0.92; keyA=-90; break;
    case 'night':    tR=45;  tG=65;  tB=130; bright=0.50; keyA=-25; break;
    case 'studio':   tR=245; tG=245; tB=245; bright=1.00; keyA=-45; break;
    case 'dramatic': tR=210; tG=140; tB=85;  bright=0.82; keyA=-120; break;
  }

  const tint = (S.preset === 'auto' ? 0.35 : 0.55) * (S.blendAmt / 100 + 0.35);
  const rad = (keyA * Math.PI) / 180;
  const lx = Math.cos(rad), ly = Math.sin(rad);
  const w = c.width, h = c.height;

  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const i = (y*w + x) * 4;
      if (px[i+3] === 0) continue;

      // Directional shading
      const nx = (x/w) - 0.5, ny = (y/h) - 0.5;
      const facing = (nx*lx + ny*ly) + 0.5;
      const shade = 0.62 + facing * 0.58;

      let r = px[i]   * shade;
      let g = px[i+1] * shade;
      let b = px[i+2] * shade;

      // Ambient tint (bounce light)
      r = r * (1 - tint) + tR * tint * (r/255);
      g = g * (1 - tint) + tG * tint * (g/255);
      b = b * (1 - tint) + tB * tint * (b/255);

      // Brightness
      r *= bright; g *= bright; b *= bright;

      // Warmth slider
      const wm = S.warmth / 100;
      r *= (1 + wm * 0.45);
      g *= (1 + wm * 0.10);
      b *= (1 - wm * 0.45);

      // Slight S-curve contrast
      const con = 1.09;
      r = ((r/255 - 0.5) * con + 0.5) * 255;
      g = ((g/255 - 0.5) * con + 0.5) * 255;
      b = ((b/255 - 0.5) * con + 0.5) * 255;

      px[i]   = Math.max(0, Math.min(255, r));
      px[i+1] = Math.max(0, Math.min(255, g));
      px[i+2] = Math.max(0, Math.min(255, b));
    }
  }
  cx.putImageData(id, 0, 0);
  return loadImg(c.toDataURL('image/png'));
}

/* ============================================================
   SHADOW
   ============================================================ */
async function buildShadow(cutout, scene, opacity) {
  const c = document.createElement('canvas');
  c.width = cutout.width; c.height = cutout.height;
  const cx = c.getContext('2d');
  cx.drawImage(cutout, 0, 0);
  const id = cx.getImageData(0, 0, c.width, c.height);
  const px = id.data;

  const shR = Math.round(scene.r * 0.22);
  const shG = Math.round(scene.g * 0.22);
  const shB = Math.round(scene.b * 0.22);

  for (let i = 0; i < px.length; i += 4) {
    if (px[i+3] === 0) continue;
    px[i]   = shR;
    px[i+1] = shG;
    px[i+2] = shB;
    px[i+3] = Math.round(px[i+3] * opacity);
  }
  cx.putImageData(id, 0, 0);
  return loadImg(c.toDataURL('image/png'));
}

/* ============================================================
   MAIN RENDER
   ============================================================ */
async function render() {
  if (!S.bgReady || !S.cutoutReady) return;
  S.processing = true;
  updateButtons();

  try {
    setStatus('Analyzing scene…', 'working');
    setProgress(15);
    const scene = analyzeScene(S.bg);
    S.scene = scene;
    await new Promise(r => setTimeout(r, 40));

    setStatus('Relighting subject…', 'working');
    setProgress(40);
    const lit = await relight(S.cutout, scene);

    setStatus('Casting shadows…', 'working');
    setProgress(65);
    const shadowOpacity = (S.shadowAmt / 100) * 0.85;
    const shadow = shadowOpacity > 0.02 ? await buildShadow(lit, scene, shadowOpacity) : null;

    setStatus('Compositing…', 'working');
    setProgress(85);

    // Canvas size — cap at reasonable resolution
    const maxW = 1400;
    let W = S.bg.width, H = S.bg.height;
    if (W > maxW) {
      H = Math.round(H * (maxW / W));
      W = maxW;
    }
    canvas.width = W;
    canvas.height = H;

    // Draw background
    drawCover(ctx, S.bg, W, H);

    // Subject placement
    const ar = lit.width / lit.height;
    let sw = W * (S.sizePct / 100);
    let sh = sw / ar;
    const maxSH = H * 0.78;
    if (sh > maxSH) { sh = maxSH; sw = sh * ar; }
    const sx = (W - sw) / 2;
    const sy = H * (S.posYPct / 100) - sh * 0.5;

    // Shadow
    if (shadow) {
      const rad = (scene.keyAngle * Math.PI) / 180;
      const offX = Math.cos(rad + Math.PI) * sw * 0.02;
      const offY = Math.abs(Math.sin(rad)) * sh * 0.03 + sh * 0.025;
      const sc = 1.02;
      const dw = sw * sc, dh = sh * sc;
      const dx = sx - (dw - sw) / 2 + offX;
      const dy = sy - (dh - sh) / 2 + offY;
      ctx.save();
      ctx.filter = `blur(${Math.max(6, Math.round(sw * 0.013))}px)`;
      ctx.drawImage(shadow, dx, dy, dw, dh);
      ctx.restore();
    }

    // Subject
    ctx.drawImage(lit, sx, sy, sw, sh);

    // Atmospheric unification
    ctx.save();
    ctx.globalCompositeOperation = 'overlay';
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, `rgba(${scene.r|0},${scene.g|0},${scene.b|0},0.05)`);
    grad.addColorStop(1, `rgba(${scene.r|0},${scene.g|0},${scene.b|0},0.02)`);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();

    // Vignette
    ctx.save();
    const vig = ctx.createRadialGradient(W/2, H/2, H*0.35, W/2, H/2, H*0.95);
    vig.addColorStop(0, 'rgba(0,0,0,0)');
    vig.addColorStop(1, 'rgba(0,0,0,0.32)');
    ctx.fillStyle = vig;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();

    // Grain
    if (S.grain > 0) addGrain(ctx, W, H, S.grain / 100 * 0.06);

    setProgress(100);
    setTimeout(() => setProgress(0), 400);

    S.lastPNG = canvas.toDataURL('image/png');
    downloadBtn.disabled = false;
    setStatus('Composite ready. Download or tweak and re-render.', 'done');
    setMeta(`${W}×${H} · ${S.preset}`);
  } catch (err) {
    console.error(err);
    setStatus('Render error: ' + err.message, 'error');
  } finally {
    S.processing = false;
    updateButtons();
  }
}

function drawCover(ctx, img, W, H) {
  const ir = img.width / img.height;
  const cr = W / H;
  let dw, dh, ox, oy;
  if (ir > cr) {
    dh = H; dw = img.width * (H / img.height);
    ox = (W - dw) / 2; oy = 0;
  } else {
    dw = W; dh = img.height * (W / img.width);
    ox = 0; oy = (H - dh) / 2;
  }
  ctx.drawImage(img, ox, oy, dw, dh);
}

function addGrain(ctx, W, H, intensity) {
  const img = ctx.getImageData(0, 0, W, H);
  const d = img.data;
  const amt = intensity * 255;
  for (let i = 0; i < d.length; i += 4) {
    const n = (Math.random() - 0.5) * amt;
    d[i]   = Math.max(0, Math.min(255, d[i]   + n));
    d[i+1] = Math.max(0, Math.min(255, d[i+1] + n));
    d[i+2] = Math.max(0, Math.min(255, d[i+2] + n));
  }
  ctx.putImageData(img, 0, 0);
}

/* ============================================================
   EVENT HANDLERS
   ============================================================ */

// Background upload
bgInput.addEventListener('change', async e => {
  const f = e.target.files[0];
  if (!f) return;
  try {
    setStatus('Loading background…', 'working');
    S.bg = await loadImg(f);
    S.bgReady = true;
    bgUpload.classList.add('has-file');
    bgThumb.src = S.bg.src;
    setStatus('Background loaded. Now upload the car.', 'done');
    setMeta(`${S.bg.width}×${S.bg.height}`);
    updateButtons();
    if (S.cutoutReady) render();
  } catch (err) {
    setStatus('Background error: ' + err.message, 'error');
  }
});

// Foreground upload → AI cutout with fallback
fgInput.addEventListener('change', async e => {
  const f = e.target.files[0];
  if (!f) return;
  try {
    S.fg = await loadImg(f);
    S.fgReady = true;
    fgUpload.classList.add('has-file');
    fgThumb.src = S.fg.src;

    setStatus('Isolating subject…', 'working');
    setProgress(8);

    let cut = null;
    try {
      cut = await aiCutout(f);
      setStatus('AI cutout complete.', 'done');
    } catch (aiErr) {
      console.warn('AI failed, using fallback:', aiErr.message);
      setStatus('Using fast cutout (AI unavailable)…', 'working');
      setProgress(50);
      cut = await fallbackCutout(S.fg);
    }

    S.cutout = cut;
    S.cutoutReady = true;
    setProgress(0);
    setStatus('Subject ready. Click Render Composite.', 'done');
    setMeta(`${cut.width}×${cut.height} cutout`);
    updateButtons();

    if (S.bgReady) setTimeout(render, 200);
  } catch (err) {
    console.error(err);
    setStatus('Subject error: ' + err.message, 'error');
    setProgress(0);
  }
});

// Presets
document.querySelectorAll('.preset').forEach(p => {
  p.addEventListener('click', () => {
    document.querySelectorAll('.preset').forEach(x => x.classList.remove('active'));
    p.classList.add('active');
    S.preset = p.dataset.preset;
    if (S.bgReady && S.cutoutReady) render();
  });
});

// Sliders
function bindSlider(id, valId, key, fmt = v => v + '%') {
  const s = $(id), v = $(valId);
  const update = () => {
    S[key] = +s.value;
    v.textContent = fmt(s.value);
  };
  s.addEventListener('input', update);
  s.addEventListener('change', () => { if (S.bgReady && S.cutoutReady) render(); });
  update();
}
bindSlider('sizeSlider', 'sizeVal', 'sizePct');
bindSlider('posYSlider', 'posYVal', 'posYPct');
bindSlider('shadowSlider', 'shadowVal', 'shadowAmt');
bindSlider('blendSlider', 'blendVal', 'blendAmt');
bindSlider('warmSlider', 'warmVal', 'warmth', v => (v > 0 ? '+' : '') + v);
bindSlider('grainSlider', 'grainVal', 'grain', v => v);

// Buttons
renderBtn.addEventListener('click', render);
downloadBtn.addEventListener('click', () => {
  if (!S.lastPNG) return;
  const a = document.createElement('a');
  a.href = S.lastPNG;
  a.download = `mulangas-studios-${S.preset}-${Date.now()}.png`;
  a.click();
  setStatus('Downloaded.', 'done');
});
resetBtn.addEventListener('click', () => {
  bgInput.value = ''; fgInput.value = '';
  S.bg = S.fg = S.cutout = null;
  S.bgReady = S.fgReady = S.cutoutReady = false;
  S.lastPNG = null;
  bgUpload.classList.remove('has-file');
  fgUpload.classList.remove('has-file');
  bgThumb.src = ''; fgThumb.src = '';
  setStatus('Reset. Upload both images to begin.');
  setMeta('');
  updateButtons();
  drawPlaceholder();
});

/* ============================================================
   PLACEHOLDER
   ============================================================ */
function drawPlaceholder() {
  canvas.width = 1400;
  canvas.height = 900;
  const g = ctx.createLinearGradient(0, 0, 1400, 900);
  g.addColorStop(0, '#0d0d10');
  g.addColorStop(1, '#14141a');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 1400, 900);

  ctx.fillStyle = '#2a2a30';
  ctx.font = '300 40px Inter, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('Mulangas Studios', 700, 400);
  ctx.font = '300 18px Inter, sans-serif';
  ctx.fillStyle = '#1f1f24';
  ctx.fillText('Upload a background + car photo to begin', 700, 450);
}
drawPlaceholder();
setStatus('Upload both images to begin.');
updateButtons();
</script>
